# SPDX-License-Identifier: GPL-3.0-only
name: Tested firmware channels

on:
  push:
    branches: [precheck]
    paths-ignore:
      - tools/preview_site.py
      - tests/preview_site_test.py
      - .github/workflows/precheck.yml
      - .github/workflows/publication-recovery.yml
      - .github/publication-recovery.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: felucca-pages
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == 'fgunited/Felucca-PR'
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.channels.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Check publication integrity and channel configuration
        run: python3 tests/preview_site_test.py
      - name: Resolve pinned source commits
        id: channels
        run: python3 tools/preview_site.py matrix .github/preview-channels.json >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: infra
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          path: source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python3 -m pip install Pillow fonttools
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/jieli
            ${{ runner.temp }}/ac79-sdk
          key: felucca-jieli-ac79nn-v1.2.1
      - name: Prepare JieLi toolchain and required SDK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang" ]; then
            sh tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          fi
          sdk="$RUNNER_TEMP/ac79-sdk"
          if [ ! -f "$sdk/cpu/wl82/tools/uboot.boot" ] || [ ! -f "$sdk/cpu/wl82/tools/cfg_tool.bin" ] || [ ! -f "$sdk/cpu/wl82/tools/cfg/eq_cfg_hw.bin" ]; then
            if [ -d "$sdk" ]; then mv "$sdk" "$sdk-incomplete-$GITHUB_RUN_ID"; fi
            fetched=false
            for delay in 0 5 15 30; do
              sleep "$delay"
              attempt=$(mktemp -d "$RUNNER_TEMP/ac79-attempt.XXXXXX")
              if git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$attempt/source"; then
                mv "$attempt/source" "$sdk"
                rmdir "$attempt"
                fetched=true
                break
              fi
              rm -rf "$attempt"
            done
            if [ "$fetched" != true ]; then echo "SDK download failed after four attempts" >&2; exit 1; fi
          fi
      - name: Build firmware and check memory layout
        working-directory: source
        shell: bash
        run: |
          export JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain"
          export AC79_SDK="$RUNNER_TEMP/ac79-sdk"
          sh build.sh
      - name: Prepare Emscripten
        shell: bash
        run: |
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23
      - name: Build emulator and run the complete source suite
        # Upstream drumfuzz's PREEMPT declarations precede its stdint include on GCC.
        # Supply the standard types to host compilation; source and assertions stay unchanged.
        env:
          CC: cc -include stdint.h
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          export JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain"
          export AC79_SDK="$RUNNER_TEMP/ac79-sdk"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          sh web/emu/build.sh
          sh tests/run_tests.sh
          node web/emu/emu_test.mjs build/emu/felucca.wasm
      - name: Assemble matching firmware, installer, editor and emulator
        env:
          CHANNEL_JSON: ${{ toJSON(matrix) }}
          CHANNEL_ID: ${{ matrix.id }}
        run: python3 infra/tools/preview_site.py assemble source "build/channel-$CHANNEL_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: channel-${{ matrix.id }}
          path: build/channel-${{ matrix.id }}/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: infra
      - uses: actions/download-artifact@v4
        with:
          pattern: channel-*
          path: incoming
      - name: Restore persistent Pages channels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          if git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "https://github.com/$GITHUB_REPOSITORY.git" state
          else
            mkdir state
            git -C state init
            git -C state checkout --orphan gh-pages
            git -C state remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
      - name: Preserve other channels and immutable builds
        run: python3 infra/tools/preview_site.py publish incoming state
      - name: Save the complete Pages state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -C state config user.name github-actions[bot]
          git -C state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C state add .
          if ! git -C state diff --cached --quiet; then
            git -C state commit -m "Publish tested channels from run $GITHUB_RUN_ID"
            git -C state push origin HEAD:gh-pages
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: state
      - name: Deploy tested channels
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record publication
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Tested channels: $PAGES_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commits and checksums are linked on every channel page." >> "$GITHUB_STEP_SUMMARY"
