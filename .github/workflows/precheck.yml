name: Precheck build and Pages

on:
  push:
    branches: [precheck]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: felucca-precheck-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'fgunited/Felucca-PR' && github.ref == 'refs/heads/precheck'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install Pillow fonttools
      - name: Install JieLi toolchain
        run: sh tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
      - name: Download required AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$RUNNER_TEMP/ac79-sdk"
      - name: Build firmware and check target budgets
        run: |
          export JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain"
          export AC79_SDK="$RUNNER_TEMP/ac79-sdk"
          sh build.sh
      - name: Build browser emulator
        shell: bash
        run: |
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          sh web/emu/build.sh
      - name: Run regression suite and emulator checks
        shell: bash
        run: |
          export JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain"
          export AC79_SDK="$RUNNER_TEMP/ac79-sdk"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          sh tests/run_tests.sh
          node web/emu/emu_test.mjs build/emu/felucca.wasm
      - name: Assemble matching installer, editor, firmware and emulator
        run: python tools/make_precheck_site.py build/precheck-site
      - name: Upload downloadable test package
        uses: actions/upload-artifact@v4
        with:
          name: felucca-precheck-${{ github.sha }}
          path: build/precheck-site/
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/precheck-site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested precheck build
        id: deployment
        uses: actions/deploy-pages@v4
