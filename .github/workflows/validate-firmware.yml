name: Validate upstream firmware

on:
  push:
    branches: [validation/upstream]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a1216c8a6c3d36e99edf6e42a93f5f0fef4e5226
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install Pillow fonttools
      - name: Install JieLi toolchain
        run: sh tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
      - name: Download upstream's required AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$RUNNER_TEMP/ac79-sdk"
      - name: Build and check firmware
        shell: bash
        run: |
          export JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain"
          export AC79_SDK="$RUNNER_TEMP/ac79-sdk"
          sh build.sh
          sh tests/run_tests.sh
          printf '%s\\n' 'a1216c8a6c3d36e99edf6e42a93f5f0fef4e5226' > build/SOURCE_COMMIT.txt
      - name: Upload installable firmware and licenses
        uses: actions/upload-artifact@v4
        with:
          name: felucca-pr-a1216c8a6c3d
          if-no-files-found: error
          path: |
            build/SOURCE_COMMIT.txt
            build/felucca.fwsc
            build/felucca.bin
            build/loader/ota.bin
            LICENSE
            LICENSING.md
            LICENSES/
            assets/samples-cc0/ATTRIBUTION.txt
